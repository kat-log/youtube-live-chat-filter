<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;color:#fff}
#bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(900px 900px at 20% 15%,#4a2590 0%,transparent 60%),radial-gradient(900px 900px at 85% 85%,#8a2464 0%,transparent 60%),linear-gradient(160deg,#1b0f3f,#2a1350)}
#rays{position:absolute;left:50%;top:46%;width:3200px;height:3200px;margin:-1600px 0 0 -1600px;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 6deg,transparent 6deg 15deg)}
h1{position:absolute;left:0;right:0;top:150px;margin:0;text-align:center;font:400 118px/1.2 'Dela Gothic One';-webkit-text-stroke:22px #1a0b2e;paint-order:stroke fill;transform:rotate(-3deg)}
h1 .y{color:#ffd54a}
#q{position:absolute;left:0;right:0;top:500px;text-align:center;font:800 48px 'M PLUS Rounded 1c';color:#ffd7a8;-webkit-text-stroke:12px #1a0b2e;paint-order:stroke fill}
#shot{position:absolute;left:105px;top:680px;width:870px;height:778px;border-radius:30px;overflow:hidden;background:#f7f7f7;box-shadow:0 30px 90px rgba(0,0,0,.7);transform:rotate(2deg)}
#shot img{display:block;width:870px}
#ring{position:absolute;left:4px;top:302px;width:856px;height:158px;border:10px solid #ffd54a;border-radius:22px;box-shadow:0 0 0 10px rgba(255,213,74,.28),0 0 60px rgba(255,213,74,.7)}
.tag{position:absolute;font:800 52px 'M PLUS Rounded 1c';padding:16px 32px;border-radius:26px;color:#2a0f3d;box-shadow:0 14px 34px rgba(0,0,0,.5);white-space:nowrap}
#t1{left:590px;top:880px;background:#ffe27a;transform:rotate(-6deg)}
#band{position:absolute;left:0;right:0;top:1600px;height:210px;background:rgba(10,4,30,.82);display:flex;align-items:center;justify-content:center;gap:26px}
#band img{width:128px;height:128px}
#band .n{font:400 64px/1.15 'Dela Gothic One'}
#band .s{font:800 34px 'M PLUS Rounded 1c';color:#b8f5d0;margin-top:6px}
</style></head><body>
<div id="bg"><div id="rays"></div></div>
<h1>Did you miss<br><span class="y">their reply?</span></h1>
<div id="q">Scrolled-away comments stay right here!</div>
<div id="shot"><img src="thumb-pop.png"><div id="ring"></div></div>
<div class="tag" id="t1">💬 Their reply!</div>
<div id="band"><img src="icon.svg"><div><div class="n">YouTube Special<br>Comments Filter</div><div class="s">Free · No API key · Chrome extension</div></div></div>
</body></html>
